server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    server_tokens off;
    error_page 404 /404.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml font/woff2 text/plain text/xml application/xml;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    if ($host = "www.genesisnex.com") {
        return 301 https://genesisnex.com$request_uri;
    }

    # Archivos internos y respaldos nunca deben servirse al visitante.
    location ~ /\. { return 404; }
    location ^~ /versiones-viejas/ { return 404; }
    location ^~ /herramientas/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|mp4|woff2|woff)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
