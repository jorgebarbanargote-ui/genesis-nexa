<!-- ============================================================
     REVIEWS SECTION — paste the 3 parts into your page.
     Bilingual EN/ES, always-visible submit form, equal cards,
     "Read more / Ver más" for long reviews.
     ============================================================ -->

<!-- ===================== HTML ===================== -->
<!-- Paste where the reviews/testimonials section goes (replace hardcoded testimonials). -->
<section class="section" id="reviews">
  <div class="container">
    <div class="cx" style="margin-bottom:34px; text-align:center;">
      <span class="label">Client Reviews</span>
      <h2 class="h2">What Our Clients Say</h2>
      <p class="lead">Real reviews from happy customers.</p>
      <button class="btn btn-cyan" id="openReviewBtn" type="button" style="margin-top:18px;">★ <span>Leave a Review</span></button>
    </div>

    <div id="reviewFormWrap" class="review-form-wrap">
      <form id="reviewForm" class="review-form">
        <h3 class="rf-title">Leave your review</h3>
        <input type="text" id="rvName" placeholder="Your name" maxlength="60" autocomplete="name" required>
        <div class="rv-stars-input" id="rvStars" role="radiogroup" aria-label="Rating">
          <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
        </div>
        <textarea id="rvText" placeholder="Tell us about your experience..." maxlength="1000" rows="4" required></textarea>
        <div class="rf-actions">
          <button type="submit" class="btn btn-cyan" id="rvSubmit"><span>Send review</span></button>
          <button type="button" class="btn btn-outline-dark" id="rvCancel">Cancel</button>
        </div>
        <p class="rf-msg" id="rvMsg"></p>
      </form>
    </div>

    <div class="testi-grid" id="reviewsGrid"></div>
    <p id="reviewsEmpty" class="reviews-empty" style="display:none;">Be the first to leave a review ✨</p>
  </div>
</section>

<!-- ===================== CSS ===================== -->
<!-- Paste inside your page <style>. Adjust colors/vars to your theme. -->
<style>
  .testi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 360px)); gap: 22px; justify-content: center; align-items: start; }
  .testi-card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:30px; box-shadow:0 2px 14px rgba(0,0,0,.06); display:flex; flex-direction:column; }
  .stars { color:#FFB800; font-size:1.05rem; letter-spacing:2px; margin-bottom:14px; }
  .testi-card p { font-size:.93rem; color:#334155; line-height:1.78; font-style:italic; margin-bottom:10px; }
  .testi-card p.clamp { display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
  .rv-more { align-self:flex-start; background:none; border:none; color:#00B4D8; font-weight:700; font-size:.8rem; cursor:pointer; padding:0; margin-bottom:12px; }
  .rv-more:hover { text-decoration:underline; }
  .testi-card .testi-name { font-weight:700; font-size:.85rem; margin-top:auto; padding-top:6px; }
  .review-form-wrap { display:block; max-width:560px; margin:0 auto 38px; }
  .review-form { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:28px; box-shadow:0 2px 14px rgba(0,0,0,.06); }
  .rf-title { font-weight:800; font-size:1.15rem; margin:0 0 18px; color:#0f172a; }
  .review-form input, .review-form textarea { width:100%; padding:13px 15px; border:1px solid #e5e7eb; border-radius:10px; font-family:inherit; font-size:.95rem; color:#334155; background:#fff; margin-bottom:14px; resize:vertical; }
  .review-form input:focus, .review-form textarea:focus { outline:none; border-color:#00B4D8; box-shadow:0 0 0 3px rgba(0,180,216,.15); }
  .rv-stars-input { font-size:2rem; letter-spacing:6px; margin-bottom:14px; cursor:pointer; user-select:none; line-height:1; }
  .rv-stars-input span { color:#d6dbe4; transition:color .12s; }
  .rv-stars-input span.on { color:#FFB800; }
  .rf-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-outline-dark { background:transparent; color:#0f172a; border:1px solid #e5e7eb; }
  .btn-outline-dark:hover { background:#f1f5f9; }
  .rf-msg { font-size:.88rem; margin:14px 0 0; font-weight:600; }
  .rf-msg.ok { color:#16a34a; }
  .rf-msg.err { color:#dc2626; }
  .reviews-empty { text-align:center; color:#64748b; font-size:.95rem; }
</style>

<!-- ===================== JS ===================== -->
<!-- Paste inside your page <script> (before </script>). -->
<script>
(function () {
  const grid = document.getElementById('reviewsGrid');
  if (!grid) return;
  const emptyEl = document.getElementById('reviewsEmpty');
  const formWrap = document.getElementById('reviewFormWrap');
  const openBtn = document.getElementById('openReviewBtn');
  const cancelBtn = document.getElementById('rvCancel');
  const form = document.getElementById('reviewForm');
  const starsEl = document.getElementById('rvStars');
  const msgEl = document.getElementById('rvMsg');
  const submitBtn = document.getElementById('rvSubmit');
  let rating = 0;

  const L = {
    en: { leave:'Leave a Review', title:'Leave your review', name:'Your name', exp:'Tell us about your experience...', send:'Send review', cancel:'Cancel', empty:'Be the first to leave a review ✨', more:'Read more', less:'Read less', thanks:'Thank you! Your review was sent and will appear after a quick approval. 🙌', fill:'Please add your name, a rating, and a comment.', conn:'Connection error. Please try again.' },
    es: { leave:'Deja tu Reseña', title:'Deja tu reseña', name:'Tu nombre', exp:'Cuéntanos tu experiencia...', send:'Enviar reseña', cancel:'Cancelar', empty:'Sé el primero en dejar una reseña ✨', more:'Ver más', less:'Ver menos', thanks:'¡Gracias! Tu reseña se envió y aparecerá tras una aprobación rápida. 🙌', fill:'Por favor agrega tu nombre, calificación y comentario.', conn:'Error de conexión. Intenta de nuevo.' }
  };
  let lang = (localStorage.getItem('ss_lang') === 'es') ? 'es' : 'en';
  const TR = () => L[lang] || L.en;

  const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const starStr = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  const paint = n => [...starsEl.children].forEach(s => s.classList.toggle('on', parseInt(s.dataset.v) <= n));

  // Call this from your language switcher: window.ssApplyReviewLang('es') / ('en')
  function applyLang(newLang) {
    if (newLang && L[newLang]) lang = newLang;
    const t = TR();
    const ob = openBtn.querySelector('span'); if (ob) ob.textContent = t.leave;
    const rt = document.querySelector('.rf-title'); if (rt) rt.textContent = t.title;
    document.getElementById('rvName').placeholder = t.name;
    document.getElementById('rvText').placeholder = t.exp;
    const sb = submitBtn.querySelector('span'); if (sb) sb.textContent = t.send; else submitBtn.textContent = t.send;
    cancelBtn.textContent = t.cancel;
    emptyEl.textContent = t.empty;
    grid.querySelectorAll('.rv-more').forEach(b => { const p = b.previousElementSibling; b.textContent = p.classList.contains('clamp') ? t.more : t.less; });
  }
  window.ssApplyReviewLang = applyLang;

  starsEl.addEventListener('mousemove', e => { if (e.target.dataset.v) paint(parseInt(e.target.dataset.v)); });
  starsEl.addEventListener('mouseleave', () => paint(rating));
  starsEl.addEventListener('click', e => { if (e.target.dataset.v) { rating = parseInt(e.target.dataset.v); paint(rating); } });

  openBtn.addEventListener('click', () => formWrap.scrollIntoView({ behavior:'smooth', block:'center' }));
  cancelBtn.addEventListener('click', () => { form.reset(); rating = 0; paint(0); msgEl.textContent = ''; msgEl.className = 'rf-msg'; });

  function render(reviews) {
    if (!reviews.length) { grid.innerHTML = ''; emptyEl.style.display = 'block'; return; }
    emptyEl.style.display = 'none';
    grid.innerHTML = reviews.map(r => `
      <div class="testi-card">
        <div class="stars">${starStr(r.stars)}</div>
        <p class="clamp">"${esc(r.text)}"</p>
        <button type="button" class="rv-more" hidden>${TR().more}</button>
        <div class="testi-name">${esc(r.name)}</div>
      </div>`).join('');
    grid.querySelectorAll('.testi-card').forEach(card => {
      const p = card.querySelector('p');
      const more = card.querySelector('.rv-more');
      if (p.scrollHeight - p.clientHeight > 4) {
        more.hidden = false;
        more.addEventListener('click', () => { p.classList.toggle('clamp'); more.textContent = p.classList.contains('clamp') ? TR().more : TR().less; });
      }
    });
  }

  async function load() {
    try { const res = await fetch('/api/reviews'); render(await res.json()); } catch (e) { render([]); }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('rvName').value.trim();
    const text = document.getElementById('rvText').value.trim();
    msgEl.className = 'rf-msg';
    if (!name || !text || !rating) { msgEl.textContent = TR().fill; msgEl.classList.add('err'); return; }
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/reviews', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ name, stars: rating, text }) });
      const data = await res.json();
      if (res.ok && data.ok) {
        msgEl.textContent = TR().thanks; msgEl.classList.add('ok');
        form.reset(); rating = 0; paint(0);
        setTimeout(() => { msgEl.textContent = ''; msgEl.className = 'rf-msg'; }, 6000);
      } else { msgEl.textContent = data.error || TR().conn; msgEl.classList.add('err'); }
    } catch (e) { msgEl.textContent = TR().conn; msgEl.classList.add('err'); }
    submitBtn.disabled = false;
  });

  applyLang(lang);
  load();
})();
</script>
