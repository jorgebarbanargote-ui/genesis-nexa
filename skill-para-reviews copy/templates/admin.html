<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SunSplash · Panel de Reseñas</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0D1128; color: #fff; margin: 0; padding: 24px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { color: #00D4FF; font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: #8899BB; font-size: .85rem; margin: 0 0 24px; }
  .card { background: #161B3C; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: #0D1128; color: #fff; font-size: 1rem; }
  button { font-family: inherit; font-weight: 700; border: none; border-radius: 9px; padding: 11px 18px; cursor: pointer; font-size: .9rem; }
  .btn-main { background: #00B4D8; color: #fff; width: 100%; margin-top: 12px; }
  .btn-approve { background: #16a34a; color: #fff; }
  .btn-delete { background: #dc2626; color: #fff; }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .rv { border-left: 4px solid #2a335f; }
  .rv.pending { border-left-color: #f59e0b; }
  .rv.approved { border-left-color: #16a34a; }
  .rv-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .rv-name { font-weight: 700; font-size: 1rem; }
  .rv-stars { color: #FFB800; letter-spacing: 2px; }
  .rv-text { color: #cdd6f4; line-height: 1.55; margin: 10px 0 0; font-size: .95rem; }
  .rv-meta { color: #6b7699; font-size: .72rem; margin-top: 8px; }
  .tag { font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
  .tag.pending { background: rgba(245,158,11,.18); color: #f59e0b; }
  .tag.approved { background: rgba(22,163,74,.18); color: #34d399; }
  .empty { color: #6b7699; text-align: center; padding: 30px; }
  .err { color: #f87171; font-size: .85rem; margin-top: 10px; }
  .logout { background: transparent; color: #8899BB; text-decoration: underline; padding: 0; font-weight: 600; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SunSplash · Panel de Reseñas</h1>
  <p class="sub">Aprueba o borra las reseñas que dejan tus clientes.</p>

  <div id="loginCard" class="card">
    <input type="password" id="pw" placeholder="Contraseña del panel" autocomplete="current-password">
    <button class="btn-main" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="panel" style="display:none;">
    <div class="toolbar">
      <span id="count" class="sub" style="margin:0;"></span>
      <button class="logout" id="logoutBtn">Salir</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
  let PW = '';
  const $ = id => document.getElementById(id);

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ password: PW }, body || {}))
    });
    if (res.status === 401) throw new Error('401');
    return res.json();
  }

  function starStr(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  function render(reviews) {
    const pend = reviews.filter(r => r.status === 'pending').length;
    $('count').textContent = reviews.length + ' reseñas · ' + pend + ' pendientes';
    if (!reviews.length) { $('list').innerHTML = '<div class="empty">Aún no hay reseñas.</div>'; return; }
    $('list').innerHTML = reviews.map(r => `
      <div class="card rv ${r.status}">
        <div class="rv-top">
          <span class="rv-name">${esc(r.name)} <span class="rv-stars">${starStr(r.stars)}</span></span>
          <span class="tag ${r.status}">${r.status === 'pending' ? 'Pendiente' : 'Publicada'}</span>
        </div>
        <p class="rv-text">${esc(r.text)}</p>
        <div class="rv-meta">${new Date(r.createdAt).toLocaleString()}</div>
        <div class="btn-row">
          ${r.status === 'pending' ? `<button class="btn-approve" onclick="approve('${r.id}')">✅ Aprobar</button>` : ''}
          <button class="btn-delete" onclick="del('${r.id}')">🗑️ Borrar</button>
        </div>
      </div>`).join('');
  }

  function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  async function load() {
    try {
      const data = await api('/api/admin/list');
      render(data.reviews || []);
    } catch (e) { logout(); }
  }

  window.approve = async id => { await api('/api/admin/approve', { id }); load(); };
  window.del = async id => { if (confirm('¿Borrar esta reseña?')) { await api('/api/admin/delete', { id }); load(); } };

  function showPanel() { $('loginCard').style.display = 'none'; $('panel').style.display = 'block'; load(); }
  function logout() { PW = ''; sessionStorage.removeItem('ss_pw'); $('panel').style.display = 'none'; $('loginCard').style.display = 'block'; $('pw').value = ''; }

  $('loginBtn').onclick = async () => {
    PW = $('pw').value;
    $('loginErr').textContent = '';
    try {
      await api('/api/admin/list');
      sessionStorage.setItem('ss_pw', PW);
      showPanel();
    } catch (e) { $('loginErr').textContent = 'Contraseña incorrecta.'; PW = ''; }
  };
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').onclick = logout;

  const saved = sessionStorage.getItem('ss_pw');
  if (saved) { PW = saved; showPanel(); }
</script>
</body>
</html>
